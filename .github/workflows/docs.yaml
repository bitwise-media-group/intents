# Documentation — rebuild the Zensical site and publish it to GitHub Pages
# (oss.bitwisemedia.uk/intents/). Same steps as the org reusable release
# workflow's docs job, but keyed off pushes to main rather than a release:
# this repo cuts no releases, and the intent pages are generated from the
# committed intent files (scripts/gen_docs.py), so the site must move every
# time an intent does. Needs Settings -> Pages -> Source -> GitHub Actions.
# CI (`make build`) already proves the site builds on every PR; this job only
# publishes what merged.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "intents/**"
      - "scripts/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "tasks.toml"
  workflow_dispatch: {}

permissions: {}

# serialize Pages deployments; never cancel an in-flight publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      # check out the source to build the site
      contents: read
      # publish the GitHub Pages deployment
      pages: write
      # OIDC token the deploy-pages action exchanges for the Pages deploy
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only checkout; don't leave the token in .git/config
          submodules: true # the toolchain at .mise/, whose pins provide uv

      # uv from the toolchain pins (sha256-verified against mise.lock), on PATH
      # for the build steps. Nothing here is signed or attested, so the mise
      # cache stays on.
      - name: Setup mise (uv)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: v2026.10.20
          # sha256 of the linux-x64 mise binary for the version above, from the release's
          # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
          sha256: 2eb27467b6f369915ee76f18d66a0696cdb5c20e7ecc8cb49c2bfaca60f0fc9c
          install_args: aqua:astral-sh/uv

      # uv run resolves the locked deps (uv.lock) on demand; the generator
      # writes the intent pages and the fragments the hand-written pages embed,
      # then Zensical renders docs/ into ./site.
      - name: Build site
        run: |
          uv run python scripts/gen_docs.py
          uv run zensical build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
