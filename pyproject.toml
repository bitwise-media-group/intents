# The intents tooling and documentation site (Zensical via uv). Not a Python
# package: no [build-system], so the python archetype's build runs only
# `zensical build` (replaced in tasks.toml by docs-build, which generates the
# intent pages first). pyyaml is what scripts/intentlib.py parses intent
# frontmatter with; zensical pulls it in already, but the scripts depend on it
# directly.
[project]
name = "intents"
version = "0.1.0"
description = "Intents for the BitWise Media Group agentic product development lifecycle, and their documentation site."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BitWise Media Group Ltd.", email = "oss@bitwisemedia.uk" }]
dependencies = [
  "pyyaml>=6.0",
  "zensical>=0.0.69",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
