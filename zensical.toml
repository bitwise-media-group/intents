# intents documentation — Zensical configuration
# https://zensical.org/docs/setup/basics/
#
# Same shape and look as the flux-containers and toolchain sites (the parent
# BitWise Media Group palette, terracotta on cream, see
# docs/stylesheets/extra.css). The intent pages under docs/intents/ and the
# fragments under build/intent-docs/ are generated from the intent files by
# scripts/gen_docs.py — `make docs-build` and `make serve` run the generator
# first, so a bare `zensical build` fails on the missing pages and snippets
# (check_paths below) rather than shipping stale intents.
#
# The "Areas" section of the nav lists every generated intent page under its
# area. `make lint` (docs-check) fails when it drifts from the intent files
# and prints the expected section to paste here.

[project]
site_name = "intents"
site_description = "The work to bring maul's agentic product development lifecycle into patchy without weakening its isolation model: every intent, grouped by area, with its dependencies and open questions."
site_url = "https://oss.bitwisemedia.uk/intents/"
repo_url = "https://github.com/bitwise-media-group/intents"
repo_name = "bitwise-media-group/intents"
# The `#__consent` link re-opens the cookie consent dialog so visitors can
# change their choice at any time (see [project.extra.consent] below).
copyright = '© 2026 BitWise Media Group Ltd — <a href="#__consent">Change cookie settings</a>'
dev_addr = "localhost:8004"

# Paths are relative to docs_dir (default: "docs")
extra_css = ["stylesheets/extra.css"]

